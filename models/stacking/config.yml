smote:
  enabled: false
  random_state: 42
  k_neighbors: 5
stack:
  cv: 5
  stack_method: predict_proba
  passthrough: false
  n_jobs: -1
meta:
  C: 1.0
  max_iter: 2000
  random_state: 42
  class_weight:
    0: 1.0
    1: 2.0
lightgbm:
  objective: binary
  random_state: 42
  n_jobs: -1
  verbose: -1
  n_estimators: 600
  max_depth: 5
  learning_rate: 0.08
  num_leaves: 63
  subsample: 0.8
  colsample_bytree: 0.7
  min_child_samples: 10
  reg_lambda: 0.5
  reg_alpha: 0.3
xgboost:
  objective: binary:logistic
  eval_metric: logloss
  tree_method: hist
  random_state: 42
  n_jobs: -1
  n_estimators: 800
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  gamma: 0.2
  min_child_weight: 1
  reg_lambda: 1.0
  reg_alpha: 0.3
  scale_pos_weight: 2.5
histgb:
  random_state: 42
  max_iter: 400
  max_depth: 7
  learning_rate: 0.05
  max_leaf_nodes: 63
  min_samples_leaf: 10
  l2_regularization: 0.1
  max_features: 0.8
