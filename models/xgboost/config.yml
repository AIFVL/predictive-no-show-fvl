smote:
  enabled: false
  random_state: 42
  k_neighbors: 5
xgboost:
  objective: binary:logistic
  eval_metric: logloss
  tree_method: hist
  random_state: 42
  n_jobs: -1
  n_estimators: 800
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  gamma: 0.2
  min_child_weight: 1
  reg_lambda: 1.0
  reg_alpha: 0.3
  scale_pos_weight: 2.5
