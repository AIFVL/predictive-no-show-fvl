data:
  processed_csv: data/processed/df_limpio.csv
  target: Appointment Type
  features_num:
    - Age
    - Number of Diseases
    - Recent Hospitalization
    - Number of Medications
    - Hour
    - Creation to Assignment Interval
    - Number of Previous Attendance
    - Number of Previous Non-Attendance
  features_cat:
    - Sex
    - Insurance Type
    - Day
    - Month
split:
  test_size: 0.15
  val_size: 0.15
  random_state: 42
model:
  name: xgboost_no_show
  config_path: models/xgboost/config.yml
  module: models.xgboost.model
output:
  model_path: outputs/xgboost_no_show.joblib
  metrics_path: outputs/xgboost_no_show_metrics.json
threshold:
  grid_start: 0.20
  grid_end: 0.80
  grid_points: 300
  objective: f1_no_show
  min_accuracy: 0.0
  min_precision: 0.75
search:
  enabled: true
  n_iter: 40
  cv: 5
  params:
    clf__n_estimators: [600, 800, 1000, 1200]
    clf__max_depth: [4, 6, 8]
    clf__learning_rate: [0.03, 0.05, 0.08]
    clf__subsample: [0.7, 0.8, 0.9]
    clf__colsample_bytree: [0.6, 0.7, 0.8]
    clf__gamma: [0.0, 0.1, 0.2]
    clf__min_child_weight: [1, 3, 5]
    clf__reg_lambda: [1.0, 2.0, 3.0]
    clf__reg_alpha: [0.0, 0.1, 0.3]
    clf__scale_pos_weight: [2.5, 3.0, 3.5, 4.0]
