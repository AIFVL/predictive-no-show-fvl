data:
  processed_csv: data/processed/df_limpio.csv
  target: Appointment Type
  features_num:
    - Age
    - Number of Diseases
    - Recent Hospitalization
    - Number of Medications
    - Hour
    - Creation to Assignment Interval
    - Number of Previous Attendance
    - Number of Previous Non-Attendance
  features_cat:
    - Sex
    - Insurance Type
    - Day
    - Month
  use_one_hot: true
split:
  test_size: 0.15
  val_size: 0.15
  random_state: 42
model:
  name: xgboost_final
  config_path: models/xgboost/config.yml
  module: models.xgboost.model
output:
  model_path: outputs/xgboost/xgboost_final.joblib
  metrics_path: outputs/xgboost/xgboost_final_metrics.json
threshold:
  grid_start: 0.20
  grid_end: 0.80
  grid_points: 300
  objective: f1_no_show
  min_accuracy: 0.0
search:
  enabled: true
  n_iter: 25
  cv: 5
  params:
    clf__n_estimators: [400, 700, 1000]
    clf__max_depth: [4, 6, 8]
    clf__learning_rate: [0.03, 0.05, 0.08]
    clf__subsample: [0.7, 0.85, 1.0]
    clf__colsample_bytree: [0.6, 0.8, 1.0]
    clf__gamma: [0.0, 0.2, 0.4]
    clf__min_child_weight: [1, 3, 5]
    clf__reg_lambda: [0.5, 1.0, 2.0]
    clf__reg_alpha: [0.0, 0.3, 0.6]
    clf__scale_pos_weight: [1.5, 2.0, 2.5, 3.0]
