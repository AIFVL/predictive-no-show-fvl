data:
  processed_csv: data/processed/df_limpio.csv
  target: Appointment Type
  features_num:
    - Age
    - Number of Diseases
    - Recent Hospitalization
    - Number of Medications
    - Hour
    - Creation to Assignment Interval
    - Number of Previous Attendance
    - Number of Previous Non-Attendance
  features_cat:
    - Sex
    - Insurance Type
    - Day
    - Month
split:
  test_size: 0.15
  val_size: 0.15
  random_state: 42
model:
  name: stacking_no_show
  config_path: models/stacking/config.yml
  module: models.stacking.model
output:
  model_path: outputs/stacking_no_show.joblib
  metrics_path: outputs/stacking_no_show_metrics.json
threshold:
  grid_start: 0.20
  grid_end: 0.80
  grid_points: 300
  objective: f1_no_show
  min_accuracy: 0.0
search:
  enabled: true
  n_iter: 30
  cv: 5
  params:
    clf__xgb__n_estimators: [600, 900]
    clf__xgb__max_depth: [4, 6]
    clf__xgb__learning_rate: [0.03, 0.05]
    clf__xgb__subsample: [0.7, 0.9]
    clf__xgb__colsample_bytree: [0.6, 0.8]
    clf__xgb__gamma: [0.0, 0.2]
    clf__xgb__min_child_weight: [1, 3]
    clf__xgb__reg_lambda: [1.0, 2.0]
    clf__xgb__reg_alpha: [0.0, 0.3]
    clf__xgb__scale_pos_weight: [2.0, 3.0]
    clf__lgb__n_estimators: [600, 900]
    clf__lgb__max_depth: [5, 9]
    clf__lgb__learning_rate: [0.03, 0.05]
    clf__lgb__num_leaves: [31, 63]
    clf__lgb__subsample: [0.7, 0.9]
    clf__lgb__colsample_bytree: [0.6, 0.8]
    clf__lgb__min_child_samples: [5, 20]
    clf__lgb__reg_lambda: [0.0, 1.0]
    clf__lgb__reg_alpha: [0.0, 0.3]
    clf__hgb__max_iter: [200, 600]
    clf__hgb__max_depth: [5, 9]
    clf__hgb__learning_rate: [0.03, 0.08]
    clf__hgb__max_leaf_nodes: [31, 80]
    clf__hgb__min_samples_leaf: [5, 20]
    clf__hgb__l2_regularization: [0.0, 0.5]
    clf__hgb__max_features: [0.7, 1.0]
    clf__final_estimator__C: [0.5, 1.5]
    clf__final_estimator__class_weight: [balanced]
