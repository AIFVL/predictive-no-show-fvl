<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Appointment Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet" />
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
      #top { padding: 12px; background:#f4f4f4; display:flex; gap:12px; align-items:center }
      #calendar { max-width: 1100px; margin: 24px auto; }
      .form-row { display:flex; gap:8px; align-items:center }
      input, button { padding:6px 8px }
    </style>
  </head>
  <body>
    <div id="top">
      <div>
        <strong>New appointment</strong>
      </div>
      <div class="form-row">
        <input id="patient_id" placeholder="patient id" />
        <input id="hour" type="number" placeholder="hour (0-23)" min="0" max="23" />
        <input id="day" type="number" placeholder="day (1-31)" min="1" max="31" />
        <input id="month" type="number" placeholder="month (1-12)" min="1" max="12" />
        <button id="create">Create</button>
        <button id="refresh">Refresh</button>
      </div>
    </div>

    <div id="calendar"></div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>
    <script>
      const API_BASE = 'http://127.0.0.1:8000';

      const calendarEl = document.getElementById('calendar');
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        height: 'auto',
        events: []
      });
      calendar.render();

      async function fetchAppointments() {
        try {
          const res = await fetch(`${API_BASE}/appointments`);
          const data = await res.json();
          return data;
        } catch (err) {
          alert('Error fetching appointments: ' + err);
          return [];
        }
      }

      function mapToEvent(appt) {
        const year = new Date().getFullYear();
        const month = Math.max(1, appt.month || 1);
        const day = Math.max(1, appt.day || 1);
        const hour = appt.hour ?? 9;
        const start = new Date(year, month - 1, day, hour, 0, 0);
        return {
          id: String(appt.id),
          title: `Patient ${appt.patient_id}`,
          start: start.toISOString(),
        };
      }

      async function loadAndRender() {
        const appts = await fetchAppointments();
        const events = appts.map(mapToEvent);
        calendar.removeAllEvents();
        events.forEach(e => calendar.addEvent(e));
      }

      document.getElementById('refresh').addEventListener('click', () => loadAndRender());

      document.getElementById('create').addEventListener('click', async () => {
        const patient_id = document.getElementById('patient_id').value.trim();
        const hour = parseInt(document.getElementById('hour').value, 10);
        const day = parseInt(document.getElementById('day').value, 10);
        const month = parseInt(document.getElementById('month').value, 10);

        if (!patient_id) { alert('patient_id required'); return }
        if (isNaN(hour) || hour < 0 || hour > 23) { alert('hour invalid'); return }
        if (isNaN(day) || day < 1 || day > 31) { alert('day invalid'); return }
        if (isNaN(month) || month < 1 || month > 12) { alert('month invalid'); return }

        try {
          const res = await fetch(`${API_BASE}/appointments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ patient_id, hour, day, month })
          });
          if (!res.ok) {
            const t = await res.text();
            throw new Error(`${res.status} ${t}`);
          }
          const appt = await res.json();
          alert('Created appointment id: ' + appt.id);
          loadAndRender();
        } catch (err) {
          alert('Error creating appointment: ' + err);
        }
      });

      // initial load
      loadAndRender();
    </script>
  </body>
</html>
